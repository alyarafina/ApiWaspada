<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="robots" content="noindex" />
  <title>Peta Sebaran — Dashboard Petugas ApiWaspada</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/assets/css/style.css?v=20261112q" />
</head>
<body data-area="officer" data-page="dash-map">
  <script src="/assets/js/layout.js?v=20261112q"></script>

  <main>
    <div class="container">
      <header class="dash-head">
        <div>
          <span class="eyebrow">Dashboard petugas</span>
          <h1>Peta sebaran laporan</h1>
          <p>Ketuk penanda untuk melihat ringkasan dan membuka halaman verifikasi.</p>
        </div>
        <div class="dash-actions">
          <label for="filterStatus" class="sr-only">Saring status</label>
          <select id="filterStatus" class="form-control" style="width:auto;min-height:40px;padding-top:.45rem;padding-bottom:.45rem">
            <option value="">Semua status</option>
            <option value="pending">Menunggu verifikasi</option>
            <option value="verified">Terverifikasi</option>
            <option value="rejected">Ditolak</option>
            <option value="completed">Selesai</option>
          </select>
          <button type="button" id="btnRefreshDashboard" class="btn btn-secondary btn-sm"><i data-icon="refresh"></i> Segarkan</button>
        </div>
      </header>

      <div class="card" style="padding:.6rem">
        <div id="officerDashboardMap" class="map-box map-tall"></div>
        <div class="map-legend" style="padding:0 .4rem .3rem">
          <span class="legend-item"><span class="legend-marker" style="background:#F59E0B"></span>Menunggu verifikasi</span>
          <span class="legend-item"><span class="legend-marker" style="background:#2563EB"></span>Terverifikasi</span>
          <span class="legend-item"><span class="legend-marker" style="background:#16A34A"></span>Selesai</span>
          <span class="legend-item"><span class="legend-marker" style="background:#64748B"></span>Ditolak</span>
          <span class="legend-item" style="margin-left:auto" id="mapMarkerCount"></span>
        </div>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/assets/js/config.js?v=20261112q"></script>
  <script src="/assets/js/utils.js?v=20261112q"></script>
  <script src="/assets/js/map.js?v=20261112q"></script>
  <script src="/assets/js/auth.js?v=20261112q"></script>
  <script src="/assets/js/dashboard.js?v=20261112q"></script>
</body>
</html>
