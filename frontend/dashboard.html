<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="robots" content="noindex" />
  <title>Ringkasan — Dashboard Petugas ApiWaspada</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/css/style.css?v=20261112q" />
</head>
<body data-area="officer" data-page="dash-summary">
  <script src="/assets/js/layout.js?v=20261112q"></script>

  <main>
    <div class="container">
      <header class="dash-head">
        <div>
          <span class="eyebrow">Dashboard petugas</span>
          <h1 id="dashGreeting">Selamat datang</h1>
          <p>Ringkasan laporan kebakaran Kota Jambi secara langsung.</p>
        </div>
        <div class="dash-actions">
          <div id="dashboardAiStatus"></div>
          <button type="button" id="btnRefreshDashboard" class="btn btn-secondary btn-sm"><i data-icon="refresh"></i> Segarkan</button>
        </div>
      </header>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-label"><i data-icon="file"></i> Total laporan</div>
          <div id="kpiTotal" class="kpi-value">0</div>
        </div>
        <a href="/dashboard-laporan.html?status=pending" class="kpi-card kpi-pending" style="color:inherit">
          <div class="kpi-label"><i data-icon="hourglass"></i> Menunggu</div>
          <div id="kpiPending" class="kpi-value">0</div>
        </a>
        <a href="/dashboard-laporan.html?status=verified" class="kpi-card kpi-verified" style="color:inherit">
          <div class="kpi-label"><i data-icon="shield"></i> Terverifikasi</div>
          <div id="kpiVerified" class="kpi-value">0</div>
        </a>
        <a href="/dashboard-laporan.html?status=rejected" class="kpi-card kpi-rejected" style="color:inherit">
          <div class="kpi-label"><i data-icon="ban"></i> Ditolak</div>
          <div id="kpiRejected" class="kpi-value">0</div>
        </a>
        <a href="/dashboard-laporan.html?status=completed" class="kpi-card kpi-completed" style="color:inherit">
          <div class="kpi-label"><i data-icon="check-circle"></i> Selesai</div>
          <div id="kpiCompleted" class="kpi-value">0</div>
        </a>
      </div>

      <div class="grid" style="grid-template-columns:minmax(0,1fr)">
        <div class="grid-3">
          <div class="card" style="grid-column:1 / -1">
            <div class="card-head" style="margin-bottom:.5rem">
              <div><h2 class="card-title"><i data-icon="chart"></i> Tren laporan harian</h2><p class="card-sub">Jumlah laporan masuk per tanggal.</p></div>
            </div>
            <div class="chart-box"><canvas id="chartReportsByDate" aria-label="Grafik tren laporan harian"></canvas></div>
          </div>
          <div class="card">
            <h2 class="card-title" style="margin-bottom:.75rem">Distribusi status</h2>
            <div class="chart-box"><canvas id="chartStatusDist" aria-label="Grafik distribusi status"></canvas></div>
          </div>
          <div class="card">
            <h2 class="card-title" style="margin-bottom:.75rem">Hasil deteksi AI</h2>
            <div class="chart-box"><canvas id="chartDetectionDist" aria-label="Grafik distribusi hasil deteksi AI"></canvas></div>
          </div>
          <div class="card">
            <div class="card-head" style="margin-bottom:.75rem">
              <h2 class="card-title"><i data-icon="hourglass"></i> Perlu diperiksa</h2>
              <a href="/dashboard-laporan.html?status=pending" class="btn btn-soft btn-sm">Semua</a>
            </div>
            <div id="pendingQuickList" class="pending-list">
              <div class="skeleton" style="height:58px"></div>
              <div class="skeleton" style="height:58px"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/assets/js/config.js?v=20261112q"></script>
  <script src="/assets/js/utils.js?v=20261112q"></script>
  <script src="/assets/js/auth.js?v=20261112q"></script>
  <script src="/assets/js/dashboard.js?v=20261112q"></script>
</body>
</html>
