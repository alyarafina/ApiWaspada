<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A0F0A" />
  <meta name="description" content="ApiWaspada — sistem pelaporan dugaan kebakaran Kota Jambi. Pilih masuk sebagai masyarakat atau petugas." />
  <title>ApiWaspada — Selamat Datang</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/assets/css/style.css?v=20261112q" />
</head>
<body data-area="gate" data-page="gate">
  <script src="/assets/js/layout.js?v=20261112q"></script>

  <main class="gate">
    <div class="container gate-top">
      <a href="/index.html" class="brand" aria-label="ApiWaspada">
        <svg class="brand-mark" width="38" height="38" viewBox="0 0 48 48" aria-hidden="true">
          <defs><linearGradient id="gg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#B91C1C"/><stop offset=".55" stop-color="#DC2626"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs>
          <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#gg)"/>
          <path d="M24 8c-4.5 6.5-11 11-11 19.2C13 33.4 17.9 38.5 24 38.5S35 33.4 35 27.2c0-4.9-2.8-9.1-5.6-12-.3 3.1-2.2 5-3.9 5.9C26.8 16.8 26.2 11.8 24 8Z" fill="#fff"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Api<span>Waspada</span></span>
          <span class="brand-sub">Kota Jambi</span>
        </span>
      </a>
    </div>

    <div class="container gate-body">
      <div class="gate-head">
        <span class="hero-badge"><span class="pin"><i data-icon="pin"></i></span>Siaga Kebakaran Kota Jambi</span>
        <h1>Selamat datang di <span class="accent">ApiWaspada</span></h1>
        <p>Anda masuk sebagai?</p>
      </div>

      <div class="gate-choices">
        <a href="/beranda.html" class="gate-card public">
          <span class="tag">Untuk umum</span>
          <span class="icon-tile"><i data-icon="users" class="ic-lg"></i></span>
          <div>
            <h2>Masyarakat</h2>
            <p class="lead-line">Lapor &amp; pantau kebakaran. Tanpa login.</p>
          </div>
          <span class="go">Masuk <i data-icon="arrow-right"></i></span>
        </a>

        <a href="/login.html" class="gate-card officer" id="gateOfficerCard">
          <span class="tag">Khusus petugas</span>
          <span class="icon-tile"><i data-icon="shield" class="ic-lg"></i></span>
          <div>
            <h2>Petugas</h2>
            <p class="lead-line">Periksa &amp; verifikasi laporan.</p>
          </div>
          <span class="go"><span id="gateOfficerLabel">Login petugas</span> <i data-icon="arrow-right"></i></span>
        </a>
      </div>
    </div>

    <div class="container gate-foot">
      <div class="gate-emergency">
        <span>Darurat?</span>
        <a href="tel:113"><i data-icon="phone"></i> 113 Damkar</a>
        <a href="tel:112"><i data-icon="phone"></i> 112</a>
      </div>
      <p class="gate-copy">&copy; 2026 ApiWaspada Kota Jambi</p>
    </div>
  </main>

  <script src="/assets/js/config.js?v=20261112q"></script>
  <script>
    // Jika petugas masih punya sesi di perangkat ini, arahkan langsung ke dashboard.
    document.addEventListener("DOMContentLoaded", function () {
      try {
        var key = (window.APIWASPADA_CONFIG && window.APIWASPADA_CONFIG.TOKEN_STORAGE_KEY) || "apiwaspada_officer_token";
        if (localStorage.getItem(key)) {
          document.getElementById("gateOfficerCard").setAttribute("href", "/dashboard.html");
          document.getElementById("gateOfficerLabel").textContent = "Lanjut ke dashboard";
        }
      } catch (e) { /* abaikan */ }
    });
  </script>
</body>
</html>
